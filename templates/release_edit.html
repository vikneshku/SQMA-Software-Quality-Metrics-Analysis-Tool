{% extends "base.html" %}
{% block title %}Edit release - {{ project.name }}{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit release {{ r.name }}</h2></div>
<div class="page-body"><div class="panel" style="max-width:560px">
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-2"><label class="form-label">Name</label><input name="name" class="form-control" required maxlength="60" value="{{ r.name }}"></div>
    <div class="mb-2"><label class="form-label">Release date</label><input type="date" name="release_date" class="form-control" value="{{ r.release_date.isoformat() if r.release_date else '' }}"></div>
    <div class="mb-3"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in statuses %}<option {{ 'selected' if s==r.status }}>{{ s }}</option>{% endfor %}</select></div>
    <button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('bugs.releases', project_id=project.id) }}">Cancel</a>
  </form></div></div>
{% endblock %}
