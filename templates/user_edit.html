{% extends "base.html" %}
{% block title %}Edit user - SQMA Tool{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit user: {{ u.username }}</h2></div>
<div class="page-body"><div class="panel" style="max-width:620px">
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-2"><label class="form-label">Full name</label><input name="full_name" class="form-control" maxlength="120" value="{{ u.full_name }}"></div>
    <div class="mb-2"><label class="form-label">E-mail</label><input type="email" name="email" class="form-control" maxlength="160" value="{{ u.email }}"></div>
    <div class="mb-2"><label class="form-label">Role</label>
      <select name="role" class="form-select">{% for r in roles %}<option {{ 'selected' if r==u.role }}>{{ r }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label class="form-label">New password (leave empty to keep)</label><input type="password" name="password" class="form-control" minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('auth.users') }}">Cancel</a>
  </form></div></div>
{% endblock %}
